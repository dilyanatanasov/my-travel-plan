# Production stack. For local development use docker-compose.dev.yml.
#
# Only the frontend publishes ports. Postgres and the API are reachable on the
# private compose network and nowhere else — the previous version exposed
# 5432 and 3000 on the host, which on a public server means the database is
# on the internet behind nothing but a password.

services:
  db:
    image: postgres:16-alpine
    container_name: travel_tracker_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - travel_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: travel_tracker_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      API_PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      # Same-origin in this topology, since nginx proxies /api. Kept explicit
      # so a split-origin deployment has one obvious place to change.
      CORS_ORIGIN: ${CORS_ORIGIN:-https://${DOMAIN}}
    # Reachable only from nginx on the compose network.
    expose:
      - '3000'
    depends_on:
      db:
        condition: service_healthy
    networks:
      - travel_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: travel_tracker_frontend
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      # Optional second domain that 301s to DOMAIN (e.g. mycontrail.app).
      # Leave empty until its certificate has been issued — see setup-ssl.sh.
      ALT_DOMAIN: ${ALT_DOMAIN:-}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      # Certificates issued on the host by setup-ssl.sh. Read-only: nginx has
      # no business writing to them.
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot
    depends_on:
      - backend
    networks:
      - travel_network

volumes:
  pgdata:
  certbot_webroot:

networks:
  travel_network:
    driver: bridge
