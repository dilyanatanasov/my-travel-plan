<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Contrail — You leave a trail. See it.</title>
    <meta
      name="description"
      content="Contrail maps every country you have visited and every flight you have taken, on one interactive world map."
    />

    <!--
      Link previews. These are static: crawlers for Slack, iMessage and
      Twitter do not run JavaScript, so a shared /s/:token link cannot get
      per-user tags from React. Making those dynamic needs the API to serve
      this HTML with injected tags — logged as a follow-up.
      VITE_PUBLIC_URL is only used to build the absolute og:url at build time;
      relative image paths resolve against the page's own origin.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Contrail" />
    <meta property="og:title" content="Contrail" />
    <meta
      property="og:description"
      content="You leave a trail. See it. Map every country you've been to, and every flight you've taken."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Contrail" />
    <meta
      name="twitter:description"
      content="Map every country you've been to, and every flight you've taken."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <!--
      Organic's two typefaces: Caprasimo for display numbers and screen
      titles, Figtree for everything else. preconnect because the font CSS
      and the font files come from two different origins, and without it the
      second DNS+TLS handshake happens only after the first stylesheet lands.
      display=swap so text paints in the fallback immediately rather than
      leaving headings blank while the font downloads.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Installable on a phone; logging a flight at the gate is the core use case -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Browser chrome matches the ground, per theme. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5ead8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#201e1d" />
    <!--
      iOS installs via Share > Add to Home Screen and does not require a
      service worker or HTTPS. These tags are what make it open without Safari
      chrome. 'default' keeps dark status bar text over our light header;
      black-translucent would let the page run under the status bar, which
      needs the safe-area padding the shell already applies.
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Contrail" />
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <script>
      // Set the theme before first paint. Doing this in React would show a
      // flash of the wrong theme on every load, which is worst for the people
      // who chose dark deliberately.
      (function () {
        try {
          var stored = localStorage.getItem('travel-tracker-theme');
          var dark =
            stored === 'dark' ||
            ((!stored || stored === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {
          /* localStorage can throw in private mode; light is a fine default */
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
