<!--
  Contrail. The trail a plane leaves between two points, which is literally
  what the map draws.

  A great-circle arc from a hollow origin waypoint to a solid destination one.
  Chosen over a plane or a globe because it survives favicon size: at 16px a
  plane silhouette turns to mush, while a diagonal stroke with a node at each
  end still reads.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="14" fill="#b2622d"/>
  <path d="M17.06 40.92 A 32 32 0 0 1 48 18" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="48" cy="18" r="5.5" fill="#ffffff"/>
  <circle cx="16" cy="46" r="4.2" fill="none" stroke="#ffffff" stroke-width="2.8"/>
</svg>
