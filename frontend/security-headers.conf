# Security headers, kept in one file because nginx does not inherit them.
#
# add_header is only inherited from an outer block if the inner block declares
# no add_header of its own. Since several locations set Cache-Control, a
# server-level declaration silently vanished for exactly the responses that
# matter most — the HTML document. Including this everywhere headers are set
# keeps them from being dropped by accident again.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
